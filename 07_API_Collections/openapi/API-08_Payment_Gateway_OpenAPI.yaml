openapi: "3.1.0"
info:
  title: Digitize API - Payments and Gateway
  version: v1
  description: OpenAPI skeleton for API-08 Payments and Gateway (design draft)
servers:
  - url: "{{base_url}}/api/{{api_version}}"
tags:
  - name: Payments Gateway
paths:
  /payments/initiate:
    post:
      tags: [Payments Gateway]
      summary: Initiate Payment
      operationId: payments_initiate
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /payments/{payment_id}/status:
    get:
      tags: [Payments Gateway]
      summary: Get Payment Status
      operationId: payments_status_list
      parameters:
        - name: payment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        metadata:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            error_code:
              type: string
            message:
              type: string
            category:
              type: string
