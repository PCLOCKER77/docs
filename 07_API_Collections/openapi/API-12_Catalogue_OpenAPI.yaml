openapi: "3.1.0"
info:
  title: Digitize API - Catalogue
  version: v1
  description: OpenAPI skeleton for API-12 Catalogue (design draft)
servers:
  - url: "{{base_url}}/api/{{api_version}}"
tags:
  - name: Catalogue
paths:
  /catalogue/items:
    get:
      tags: [Catalogue]
      summary: List Catalogue Items
      operationId: catalogue_list_items
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /catalogue/items/{item_id}:
    get:
      tags: [Catalogue]
      summary: Get Catalogue Item
      operationId: catalogue_get_item
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        metadata:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            error_code:
              type: string
            message:
              type: string
            category:
              type: string
