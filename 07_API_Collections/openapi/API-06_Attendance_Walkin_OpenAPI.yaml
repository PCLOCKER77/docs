openapi: "3.1.0"
info:
  title: Digitize API - Attendance and Walk-in
  version: v1
  description: OpenAPI skeleton for API-06 Attendance and Walk-in (design draft)
servers:
  - url: "{{base_url}}/api/{{api_version}}"
tags:
  - name: Attendance Walk-in
paths:
  /attendance/check-in:
    post:
      tags: [Attendance Walk-in]
      summary: Record Customer Check-in
      operationId: attendance_record_check_in
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /attendance/eligibility:
    post:
      tags: [Attendance Walk-in]
      summary: Validate Attendance Eligibility
      operationId: attendance_validate_eligibility
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /walkin-visits:
    post:
      tags: [Attendance Walk-in]
      summary: Create Walk-in Visit
      operationId: walkin_create_visit
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        metadata:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            error_code:
              type: string
            message:
              type: string
            category:
              type: string
