openapi: "3.1.0"
info:
  title: Digitize API - Membership Management
  version: v1
  description: OpenAPI skeleton for API-05 Membership Management (design draft)
servers:
  - url: "{{base_url}}/api/{{api_version}}"
tags:
  - name: Membership Management
paths:
  /membership-plans:
    get:
      tags: [Membership Management]
      summary: List Membership Plans
      operationId: membership_list_plans
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /memberships:
    post:
      tags: [Membership Management]
      summary: Create Membership
      operationId: membership_create_membership
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /memberships/{membership_id}/freeze:
    post:
      tags: [Membership Management]
      summary: Freeze Membership
      operationId: membership_freeze_membership
      parameters:
        - name: membership_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        metadata:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            error_code:
              type: string
            message:
              type: string
            category:
              type: string
