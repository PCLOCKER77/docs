openapi: "3.1.0"
info:
  title: Digitize API - Promotions and Discounts
  version: v1
  description: OpenAPI skeleton for API-09 Promotions and Discounts (design draft)
servers:
  - url: "{{base_url}}/api/{{api_version}}"
tags:
  - name: Promotions Discounts
paths:
  /promotions:
    get:
      tags: [Promotions Discounts]
      summary: List Promotions
      operationId: promotions_list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /discounts/apply:
    post:
      tags: [Promotions Discounts]
      summary: Apply Discount
      operationId: discounts_apply
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        metadata:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            error_code:
              type: string
            message:
              type: string
            category:
              type: string
