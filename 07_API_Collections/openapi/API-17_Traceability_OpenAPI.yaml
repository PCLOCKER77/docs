openapi: "3.1.0"
info:
  title: Digitize API - Traceability
  version: v1
  description: OpenAPI skeleton for API-17 Traceability and Mapping (design draft)
servers:
  - url: "{{base_url}}/api/{{api_version}}"
tags:
  - name: Traceability
paths:
  /traceability/matrix:
    get:
      tags: [Traceability]
      summary: Get Traceability Matrix
      operationId: traceability_get_matrix
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        metadata:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            error_code:
              type: string
            message:
              type: string
            category:
              type: string
