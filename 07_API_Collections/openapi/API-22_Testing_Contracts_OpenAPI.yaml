openapi: "3.1.0"
info:
  title: Digitize API - Testing and Contracts
  version: v1
  description: OpenAPI skeleton for API-22 Testing and Contract artifacts (design draft)
servers:
  - url: "{{base_url}}/api/{{api_version}}"
tags:
  - name: Testing Contracts
paths:
  /testing/contracts:
    get:
      tags: [Testing Contracts]
      summary: List Test Contracts
      operationId: testing_list_contracts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        metadata:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            error_code:
              type: string
            message:
              type: string
            category:
              type: string
