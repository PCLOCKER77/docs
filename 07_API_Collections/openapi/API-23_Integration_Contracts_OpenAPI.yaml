openapi: "3.1.0"
info:
  title: Digitize API - Integration Contracts
  version: v1
  description: OpenAPI skeleton for API-23 Integration Contracts (design draft)
servers:
  - url: "{{base_url}}/api/{{api_version}}"
tags:
  - name: Integration Contracts
paths:
  /integrations:
    get:
      tags: [Integration Contracts]
      summary: List Integrations
      operationId: integrations_list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /integrations/{integration_id}/health:
    get:
      tags: [Integration Contracts]
      summary: Check Integration Health
      operationId: integrations_check_health
      parameters:
        - name: integration_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        metadata:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            error_code:
              type: string
            message:
              type: string
            category:
              type: string
