openapi: "3.1.0"
info:
  title: Digitize API - Sales and Transactions
  version: v1
  description: OpenAPI skeleton for API-07 Sales and Transactions (design draft)
servers:
  - url: "{{base_url}}/api/{{api_version}}"
tags:
  - name: Sales Transactions
paths:
  /sales/transactions:
    post:
      tags: [Sales Transactions]
      summary: Create Transaction
      operationId: sales_create_transaction
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /sales/transactions/{transaction_id}:
    get:
      tags: [Sales Transactions]
      summary: Get Transaction
      operationId: sales_get_transaction
      parameters:
        - name: transaction_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        metadata:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            error_code:
              type: string
            message:
              type: string
            category:
              type: string
