openapi: "3.1.0"
info:
  title: Digitize API - Common Reference Collection
  version: v1
  description: OpenAPI skeleton for API-14 Common Reference Collection (design draft)
servers:
  - url: "{{base_url}}/api/{{api_version}}"
tags:
  - name: Common Reference
paths:
  /references/{reference_type}:
    get:
      tags: [Common Reference]
      summary: List reference values for a type
      operationId: references_list_by_type
      parameters:
        - name: reference_type
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /references/{reference_type}/{code}:
    get:
      tags: [Common Reference]
      summary: Get a single reference value
      operationId: references_get_value
      parameters:
        - name: reference_type
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        metadata:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            error_code:
              type: string
            message:
              type: string
            category:
              type: string
