openapi: "3.1.0"
info:
  title: Digitize API - Health Checks
  version: v1
  description: OpenAPI skeleton for API-26 Health and Liveness Checks (design draft)
servers:
  - url: "{{base_url}}/api/{{api_version}}"
tags:
  - name: Health Checks
paths:
  /health:
    get:
      tags: [Health Checks]
      summary: Service Health
      operationId: health_get_status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
components:
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        metadata:
          type: object
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
          properties:
            error_code:
              type: string
            message:
              type: string
            category:
              type: string
