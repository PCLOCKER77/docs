  - name: Attendance Walk-in
  - name: Audit Logs
  - name: Catalogue
  - name: Common Reference
  - name: Customer Management
  - name: Error Catalog
  - name: Exports Analytics
  - name: Governance
  - name: Health Checks
  - name: Identity User Role
  - name: Integration Contracts
  - name: Inventory Products
  - name: Loyalty Rewards
  - name: Membership Management
  - name: Notifications Alerts
  - name: Operational Metrics
  - name: Organization Facility Site
  - name: Payments Gateway
  - name: Platform Administration
  - name: Promotions Discounts
  - name: Report Scheduling
  - name: Sales Transactions
  - name: Testing Contracts
  - name: Traceability
  - name: Workforce Scheduling
  - name: account_id
  - name: code
